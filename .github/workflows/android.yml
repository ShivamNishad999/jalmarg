name: Android app (APK)

# Builds the JalMarg Android app from frontend/ with Capacitor and publishes
# JalMarg.apk on the "app-latest" GitHub release, so anyone can install it on a phone.
on:
  push:
    branches: [main, feat/android-app]
    paths: ['frontend/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'

      - run: npm ci

      # Optional: set the repo variable API_BASE (Settings > Secrets and variables > Actions > Variables)
      # to the deployed backend URL so the app works out of the box. Users can also set it in the app (About > Server).
      - run: npm run build
        env:
          VITE_API_BASE: ${{ vars.API_BASE || 'https://d32mtn7raxakpa.cloudfront.net' }}
          VITE_PUBLIC_URL: ${{ vars.PUBLIC_URL || 'https://d32mtn7raxakpa.cloudfront.net' }}

      - run: npx cap sync android

      - name: Build debug APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../JalMarg.apk

      - uses: actions/upload-artifact@v4
        with:
          name: JalMarg-apk
          path: JalMarg.apk

      - name: Publish on the app-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: JalMarg Android app (latest)
          body: |
            Install on Android: download JalMarg.apk on the phone, open it, allow "install unknown apps".
            Server: https://d32mtn7raxakpa.cloudfront.net (built in; change it in Profile → Server address).
            Built from ${{ github.sha }}.
          prerelease: true
          files: JalMarg.apk
