name: JalMarg CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. SECURITY & INTEGRITY AUDIT
  # ============================================================================
  security-audit:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute Publication Security Audit
        run: node scripts/audit_git_publication.mjs

  # ============================================================================
  # 2. BACKEND BUILD & TEST (Java 21 / Spring Boot 3.3 / PostGIS)
  # ============================================================================
  backend:
    name: Backend Build & Test (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: jalmarg_ci_test
          POSTGRES_USER: jalmarg_ci_user
          POSTGRES_PASSWORD: jalmarg_ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run Backend Regression Test Suite
        env:
          SPRING_PROFILES_ACTIVE: postgis
          DB_URL: jdbc:postgresql://localhost:5432/jalmarg_ci_test
          DB_USER: jalmarg_ci_user
          DB_PASSWORD: jalmarg_ci_test_password
          VISION_ENABLED: false
        run: mvn -B clean test

      - name: Package Application Jar
        env:
          SPRING_PROFILES_ACTIVE: postgis
          DB_URL: jdbc:postgresql://localhost:5432/jalmarg_ci_test
          DB_USER: jalmarg_ci_user
          DB_PASSWORD: jalmarg_ci_test_password
        run: mvn -B package -DskipTests

      - name: Upload Surefire Test Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  # ============================================================================
  # 3. FRONTEND BUILD & TEST (React 18 / Vite / Node.js 20)
  # ============================================================================
  frontend:
    name: Frontend Build & Test (Node 20 LTS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Frontend Unit & Contract Tests
        run: npm test

      - name: Build Production Frontend Assets
        run: npm run build

  # ============================================================================
  # 4. PYTHON SCIENTIFIC & ML TEST SUITE
  # ============================================================================
  python-ml:
    name: Python ML Subsystem (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ml
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ml/pyproject.toml

      - name: Upgrade Pip and Build Tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install PyTorch CPU Wheels (Lightweight CI)
        run: pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install ML Package Dependencies
        run: pip install -e ".[dev]"

      - name: Run Scientific ML Regression Suite (Pytest)
        run: pytest -v
