name: Server build (AWS)

# Builds the backend jar and the web app, and publishes both on the `server-latest`
# release. The EC2 server created by infra/jalmarg-aws.yaml downloads them from there
# on first boot and whenever /opt/jalmarg/update.sh runs.

on:
  push:
    branches: [main, feat/android-app]
    paths: ['backend/**', 'frontend/**', '.github/workflows/server-release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: maven

      - name: Backend jar (tests run in the CI workflow)
        working-directory: backend
        run: mvn -B -q -DskipTests package && cp target/jalmarg.jar ../jalmarg.jar

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Web app (served by the backend, same origin)
        working-directory: frontend
        run: |
          npm ci
          VITE_API_BASE= npm run build
          cd dist && zip -qr ../../jalmarg-web.zip .

      - name: Publish on the server-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: server-latest
          name: JalMarg server build (latest)
          body: |
            Backend jar + web app for the AWS deployment (infra/jalmarg-aws.yaml).
            No secrets inside: all configuration comes from environment variables on the server.
            Built from ${{ github.sha }}.
          prerelease: true
          files: |
            jalmarg.jar
            jalmarg-web.zip
