# ---------- JalMarg backend ----------
server.port=${PORT:8080}
spring.application.name=jalmarg

# ---------- Database ----------
# Local default: H2 file DB (zero setup). For AWS RDS MySQL set DB_URL, DB_USER, DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/jalmarg;MODE=MySQL;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=${H2_CONSOLE:false}
spring.flyway.enabled=${FLYWAY_ENABLED:false}

# ---------- Uploads ----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# ---------- JalMarg settings ----------
# AWS region used for Bedrock, S3 and SNS (Mumbai by default)
jalmarg.aws.region=${AWS_REGION:ap-south-1}

# Amazon Bedrock vision model. Leave AI_ENABLED=false to run without AWS (manual depth only).
jalmarg.ai.enabled=${AI_ENABLED:false}
# Bedrock can run in a different region from the rest (e.g. us-east-1 with us.amazon.nova-lite-v1:0)
jalmarg.ai.region=${BEDROCK_REGION:${AWS_REGION:ap-south-1}}
jalmarg.ai.model-id=${BEDROCK_MODEL_ID:apac.amazon.nova-lite-v1:0}

# Amazon S3 bucket for photos. Empty = store photos on local disk (./uploads).
jalmarg.storage.s3-bucket=${S3_BUCKET:}
jalmarg.storage.local-dir=${LOCAL_UPLOAD_DIR:./uploads}

# Amazon SNS topic for alerts. Empty = alerts are only logged.
jalmarg.alerts.sns-topic-arn=${SNS_TOPIC_ARN:}
# Run the alert check on a schedule inside the app (EventBridge can call /api/alerts/run instead)
jalmarg.alerts.cron=${ALERT_CRON:0 0 * * * *}
jalmarg.alerts.internal-scheduler=${ALERT_INTERNAL_SCHEDULER:true}
# Shared secret EventBridge sends in X-Jalmarg-Key when calling /api/alerts/run
jalmarg.alerts.run-key=${ALERT_RUN_KEY:jalmarg-alerts-secret-key-2026}
jalmarg.authority.admin-key=${ADMIN_KEY:jalmarg-authority-admin-key-2026}

# How long a report stays "active" on the map without new confirmations (hours)
jalmarg.reports.ttl-hours=${REPORT_TTL_HOURS:6}
# Load illustrative demo data on first start
jalmarg.seed.enabled=${SEED_ENABLED:true}
# Isolate demo records from real production risk calculations
jalmarg.demo.isolated-mode=${DEMO_ISOLATED_MODE:false}

# ---------- Real-world Geospatial & Environmental Telemetry ----------
# NASA GPM IMERG V07B Early Run (satellite precipitation rate, latency ~4h)
jalmarg.satellite.nasa-imerg.enabled=${NASA_IMERG_ENABLED:false}
jalmarg.satellite.nasa-imerg.endpoint=${NASA_IMERG_ENDPOINT:https://gpm1.gesdisc.eosdis.nasa.gov/opendap/GPM_L3/GPM_3IMERGHHE.07}
jalmarg.satellite.nasa-imerg.token=${NASA_EARTHDATA_TOKEN:}

# Copernicus DEM GLO-30 (elevation and relative depression index, 30m WGS84/EGM2008)
jalmarg.terrain.copernicus-dem.enabled=${COPERNICUS_DEM_ENABLED:true}

# Allowed frontend origins (comma separated)
jalmarg.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:4173,http://127.0.0.1:3000}

# ---------- Computer Vision Waterlogging Classifier (Phase 25B) ----------
jalmarg.vision.enabled=${VISION_ENABLED:true}
jalmarg.vision.model-path=${VISION_MODEL_PATH:ml/artifacts/vision/best_checkpoint.pt}
jalmarg.vision.metadata-path=${VISION_METADATA_PATH:ml/artifacts/vision/test_evaluation_report.json}
jalmarg.vision.readiness-path=${VISION_READINESS_PATH:ml/artifacts/vision/readiness_assessment.json}
jalmarg.vision.python-executable=${PYTHON_EXECUTABLE:ml/.venv/Scripts/python.exe}

management.endpoints.web.exposure.include=health

# Serve the built web app from this server (folder with index.html). Empty = API only.
jalmarg.web.dir=${WEB_DIR:}
