# ==================================================================================
# JALMARG BACKEND — PRODUCTION PROFILE (application-prod.properties)
# Target Database: jalmarg_twin on PostGIS port 5433 (Strict CarSync Isolation)
# ==================================================================================

server.port=${PORT:8080}
spring.application.name=jalmarg-prod

# ---------- Database (PostgreSQL 17.11 + PostGIS 3.6.2) ----------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/jalmarg_twin}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pooling (HikariCP)
spring.datasource.hikari.pool-name=JalMargHikariPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:15}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:3}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# JPA & Hibernate Validation (Zero automatic schema altering in production)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration/postgis
spring.flyway.validate-on-migrate=true

# ---------- Uploads & Storage ----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
jalmarg.storage.s3-bucket=${S3_BUCKET:}
jalmarg.storage.local-dir=${LOCAL_UPLOAD_DIR:./uploads}

# ---------- Production Operational Constraints ----------
# Demo records strictly isolated from real municipal risk computations
jalmarg.demo.isolated-mode=true
jalmarg.seed.enabled=false
jalmarg.reports.ttl-hours=${REPORT_TTL_HOURS:6}

# ---------- Observability & Security ----------
jalmarg.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
jalmarg.authority.admin-key=${ADMIN_KEY:jalmarg-authority-admin-key-2026}
jalmarg.alerts.run-key=${ALERT_RUN_KEY:jalmarg-alerts-secret-key-2026}

# Telemetry Integrations
jalmarg.terrain.copernicus-dem.enabled=true
jalmarg.satellite.nasa-imerg.enabled=false
jalmarg.vision.enabled=false

# Actuator Health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Logging Configuration
logging.level.root=INFO
logging.level.org.growforge.jalmarg=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
