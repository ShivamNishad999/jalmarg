# ==================================================================================
# JALMARG BACKEND — POSTGRESQL + POSTGIS CONFIGURATION (ISOLATED PORT 5433)
# Target Database: jalmarg_twin
# Host: localhost:5433
# ==================================================================================

# Database Connection (Environment variables with safe localhost defaults)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/jalmarg_twin}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration/postgis

# Digital Twin Metadata
jalmarg.digital-twin.active-profile=postgis-isolated-5433
