# Delhi NCR Study Area & Bounding Scope Configuration
# Note: This file explicitly distinguishes the operational intake bounding box
# from statutory administrative boundaries and actual ML training corridor extents.

scope_definition:
  study_area_name: "Delhi National Capital Region (NCR) & Monsoonal Priority Corridors"
  crs:
    geographic: "EPSG:4326"
    projected: "EPSG:32643" # WGS 84 / UTM zone 43N (appropriate for Delhi NCR metric distance computations)

spatial_envelopes:
  # Operational intake bounding box filter (approximate geographic envelope; NOT a statutory boundary)
  operational_intake_bbox:
    description: "Operational intake filter envelope for Delhi NCR data ingestion and coordinate plausibility checks"
    min_latitude: 28.00
    max_latitude: 29.20
    min_longitude: 76.50
    max_longitude: 77.80
    boundary_type: "APPROXIMATE_OPERATIONAL_FILTER"
    statutory_boundary: false

  # Application map viewport (used by Leaflet frontend centered on central NCR)
  application_map_viewport:
    center_latitude: 28.58
    center_longitude: 77.25
    initial_zoom: 11
    max_bounds:
      min_latitude: 28.20
      max_latitude: 29.00
      min_longitude: 76.70
      max_longitude: 77.70

  # Authentic Copernicus DEM coverage tile currently present in local storage
  copernicus_dem_coverage:
    tile_name: "Copernicus_DSM_COG_10_N28_00_E077_00_DEM.tif"
    min_latitude: 28.000000000000000
    max_latitude: 29.000000000000000
    min_longitude: 77.000000000000000
    max_longitude: 78.000000000000000
    resolution_arc_sec: 1.0 # 30m nominal resolution
    source: "Copernicus WorldDEM / ESA / Airbus Defence and Space"
    license: "Open Data (Copernicus Sentinel / DEM Licence)"

