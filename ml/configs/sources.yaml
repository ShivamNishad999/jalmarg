# Authentic Hydrometeorological & Geospatial Source Registry Configuration
# Every source is classified according to its authentic access state and provenance.

sources:
  # 1. Copernicus Global Digital Elevation Model (GLO-30 COG)
  copernicus_dem:
    dataset_code: "COP_DEM_GLO30"
    source_name: "Copernicus Digital Elevation Model (GLO-30 COG)"
    organization: "European Space Agency (ESA) & Copernicus Programme"
    official_url: "https://spacedata.copernicus.eu/collections/copernicus-digital-elevation-model"
    provenance_type: "OBSERVED"
    spatial_coverage: "Delhi NCR Tile N28_00 E077_00 (28.0N - 29.0N, 77.0E - 78.0E)"
    temporal_coverage: "Static baseline (TanDEM-X radar acquisition 2011-2015, released 2021)"
    spatial_resolution: "30 meters (1.0 arc-second)"
    temporal_resolution: "Static"
    crs: "EPSG:4326"
    vertical_datum: "EGM2008 geoid"
    units: "Meters above sea level"
    license: "Free and Open Data (Copernicus DEM Licence)"
    local_path: "backend/data/dem/Copernicus_DSM_COG_10_N28_00_E077_00_DEM.tif"
    acquisition_method: "Direct COG GeoTIFF local asset verification"
    current_availability: "VERIFIED"
    known_limitations: "Surface DSM reflects canopy/structures in dense urban fabric; not a pure bare-earth DTM."

  # 2. Open-Meteo Weather API (Hourly Forecast & Near-Real-Time Model Runs)
  open_meteo_live:
    dataset_code: "OPEN_METEO_LIVE"
    source_name: "Open-Meteo Weather Forecast & Current Conditions API"
    organization: "Open-Meteo GmbH"
    official_url: "https://api.open-meteo.com/v1/forecast"
    provenance_type: "FORECAST"
    spatial_coverage: "Global grid interpolated to Delhi NCR coordinates"
    temporal_coverage: "Live 7-day forecast & past 2-day model estimates"
    spatial_resolution: "11 km (ECMWF IFS / DWD ICON blend)"
    temporal_resolution: "Hourly"
    crs: "EPSG:4326"
    units: "Precipitation in mm, temperature in °C, wind speed in km/h"
    license: "Open-Meteo Non-Commercial / Attribution (CC-BY-4.0)"
    acquisition_method: "REST HTTP GET with JSON response"
    current_availability: "OPERATIONAL"
    known_limitations: "Model-interpolated atmospheric forecast; must not be labeled as physical rain gauge observation."

  # 3. Open-Meteo Historical Weather Archive
  open_meteo_archive:
    dataset_code: "OPEN_METEO_ARCHIVE"
    source_name: "Open-Meteo Historical Weather Archive API"
    organization: "Open-Meteo GmbH (ECMWF ERA5 & ERA5-Land backend)"
    official_url: "https://archive-api.open-meteo.com/v1/archive"
    provenance_type: "REANALYSIS"
    spatial_coverage: "Point-indexed reanalysis for Delhi NCR corridor locations"
    temporal_coverage: "Historical records (e.g. monsoon seasons 2024-2026)"
    spatial_resolution: "9 km (ERA5-Land reanalysis grid)"
    temporal_resolution: "Hourly"
    crs: "EPSG:4326"
    units: "Precipitation in mm"
    license: "CC-BY-4.0 / Copernicus CDS terms"
    acquisition_method: "REST HTTP GET with structured JSON output"
    current_availability: "VERIFIED"
    known_limitations: "Atmospheric reanalysis estimates precipitation over grid cell; may miss localized convective cloudbursts."

  # 4. India Meteorological Department (IMD) Ground Station Observations
  imd_ground_stations:
    dataset_code: "IMD_OBSERVED_RAINFALL"
    source_name: "IMD Automatic Weather Station (AWS) & Daily Rainfall Reports"
    organization: "India Meteorological Department, Ministry of Earth Sciences"
    official_url: "https://mausam.imd.gov.in / https://aws.imd.gov.in"
    provenance_type: "OBSERVED"
    spatial_coverage: "Safdarjung, Palam, Lodhi Road, Ridge, Ayanagar, Noida, Gurugram AWS"
    temporal_coverage: "Operational rain gauges"
    spatial_resolution: "Point station observations"
    temporal_resolution: "15-minute to daily bulletins"
    crs: "EPSG:4326"
    units: "Precipitation in mm"
    license: "Government of India Open Data / Restrictive API terms"
    acquisition_method: "Official API or verified PDF rainfall bulletin ingestion"
    current_availability: "BLOCKED"
    blocker_reason: "Requires official institutional IMD credentials or programmatic API token; direct public machine-readable API is not openly accessible without authorized token."
    known_limitations: "Station coverage density is sparse for hyper-local urban street microclimates."

  # 5. Copernicus Climate Data Store (CDS) ERA5-Land Reanalysis Direct API
  era5_land_direct:
    dataset_code: "ERA5_LAND_CDS"
    source_name: "ECMWF / Copernicus ERA5-Land Hourly Reanalysis (Direct CDS API)"
    organization: "Copernicus Climate Change Service (C3S) / ECMWF"
    official_url: "https://cds.climate.copernicus.eu/cdsapp#!/dataset/reanalysis-era5-land"
    provenance_type: "REANALYSIS"
    spatial_coverage: "Delhi NCR bounding box (28.0-29.2N, 76.5-77.8E)"
    temporal_coverage: "1950 to near real-time (2-3 months latency)"
    spatial_resolution: "0.1° (~9 km)"
    temporal_resolution: "Hourly"
    crs: "EPSG:4326"
    units: "Total precipitation in meters (converted to mm)"
    license: "Copernicus Licence"
    acquisition_method: "Python cdsapi package via CDS API Key (~/.cdsapirc)"
    current_availability: "BLOCKED"
    blocker_reason: "Requires user-specific CDS API UID and API key in ~/.cdsapirc. Acquisition framework implemented; awaiting CDS user registration key."
    known_limitations: "Lag of 2-3 months; reanalysis cannot provide real-time nowcasting."

  # 6. JalMarg Municipal Digital Twin PostGIS Records
  jalmarg_twin_db:
    dataset_code: "JALMARG_TWIN_MUNICIPAL"
    source_name: "JalMarg Dedicated Municipal PostGIS Cluster (Port 5433)"
    organization: "JalMarg Platform & Delhi NCR Municipal Authorities (NDMC, MCD, GMDA)"
    official_url: "postgresql://localhost:5433/jalmarg_twin"
    provenance_type: "OBSERVED"
    spatial_coverage: "Delhi NCR Municipal Zones, Verified Corridors & Road Segments"
    temporal_coverage: "Monsoon seasons 2024 - 2026"
    spatial_resolution: "Precise PostGIS Point/LineString geometries"
    temporal_resolution: "Event-timestamped"
    crs: "EPSG:4326"
    units: "Water depth in feet, priority scores, incident statuses"
    license: "Internal Municipal Operational Data"
    acquisition_method: "Direct SQL / Psycopg connection to jalmarg_twin"
    current_availability: "OPERATIONAL"
    known_limitations: "Citizen reports are unverified until municipal review; only verified reports provide positive ground truth."
